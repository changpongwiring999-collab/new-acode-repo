function changeBackground(imageUrl) {

     // ดึง Element จาก HTML
const imageInput = document.getElementById('imageInput');
const previewImg = document.getElementById('preview-img');

// ดักจับ Event เมื่อมีการเลือกไฟล์
imageInput.addEventListener('change', function(event) {
    const file = event.target.files[0]; // ดึงไฟล์รูปภาพแรกที่เลือก
    
    if (file) {
        // สร้าง URL ชั่วคราวจากไฟล์ในเครื่องเพื่อนำมาแสดงบนหน้าเว็บ
        const imageUrl = URL.createObjectURL(file);
        
        // ใส่ URL ให้กับแท็ก <img> และสั่งให้แสดงผล
        previewImg.src = imageUrl;
        previewImg.style.display = 'block';
    }
});
